name: Сборка КУБ-125 APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Сборка APK (напрямую на встроенном Android SDK)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ./KUB_125_STERZHEN.apk

      - name: Выгрузка APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: KUB-125-STERZHEN-APK
          path: ./KUB_125_STERZHEN.apk

      - name: Публикация прямой ссылки на APK в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v125.2
          name: "Большой КУБ 125 (5x5x5) APK"
          files: ./KUB_125_STERZHEN.apk
